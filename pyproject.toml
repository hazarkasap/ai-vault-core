[project]
name = "ai-vault-core"
version = "0.1.0"
description = "Event-driven AI workflow, approval, replay, and observability core"
requires-python = ">=3.12,<3.15"
dependencies = ["aiohttp==3.14.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.1", "pytest-asyncio==1.1.0", "ruff==0.12.7"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aivault_showcase"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
