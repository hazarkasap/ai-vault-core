name: Validate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
  dashboard:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: observer_dashboard}}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: 20, cache: npm, cache-dependency-path: observer_dashboard/package-lock.json}
      - run: npm ci
      - run: npm test
      - run: npm run build
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0}
      - run: bash scripts/scan_repository.sh
      - uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.3
        with:
          args: detect --source=/github/workspace --no-git --redact --no-banner
